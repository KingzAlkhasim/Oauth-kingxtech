name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build root
        run: npm run build

      - name: Install core dependencies
        working-directory: core
        run: npm ci

      - name: Type-check core
        working-directory: core
        run: npx tsc --noEmit
